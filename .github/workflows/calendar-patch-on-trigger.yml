name: Correctif final calendrier Chez Baptiste

on:
  push:
    paths:
      - calendar-trigger.txt

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner, corriger et publier
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python calendar_patch_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Met à jour les indisponibilités du calendrier"
          git push

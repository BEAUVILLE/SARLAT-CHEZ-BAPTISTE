name: Fiabiliser la mémoire propriétaire LOC

on:
  push:
    paths:
      - .github/workflows/apply-owner-state-persistence.yml
      - tools/patch-owner-state-persistence.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sarlat-loc-owner-state-persistence
  cancel-in-progress: true

jobs:
  patch-owner-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la mémoire des états
        run: python tools/patch-owner-state-persistence.py

      - name: Publier gestion.html
        run: |
          if git diff --quiet -- gestion.html; then
            echo "gestion.html déjà à jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion.html
          git commit -m "Fiabiliser la mémoire des états LOC"
          git push

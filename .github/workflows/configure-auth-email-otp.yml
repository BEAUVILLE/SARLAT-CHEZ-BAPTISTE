name: Configurer email Auth DIGIY OTP + Magic Link

on:
  push:
    paths:
      - .github/workflows/configure-auth-email-otp.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wesqmwjjtsefyjnluosj
    steps:
      - name: Vérifier le jeton de gestion Supabase
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN_ABSENT"
            exit 2
          fi

      - name: Activer code OTP tout en conservant le Magic Link
        shell: bash
        run: |
          cat > payload.json <<'JSON'
          {
            "mailer_subjects_magic_link": "Votre code d’accès DIGIYLYFE",
            "mailer_templates_magic_link_content": "<h2>Votre accès DIGIYLYFE</h2><p>Votre code à 6 chiffres :</p><p style=\"font-size:28px;font-weight:700;letter-spacing:4px\">{{ .Token }}</p><p>Entrez ce code dans votre espace propriétaire.</p><hr><p>Si votre module utilise encore le lien sécurisé, vous pouvez aussi continuer ici :</p><p><a href=\"{{ .ConfirmationURL }}\">Ouvrir mon accès DIGIYLYFE</a></p><p>Le code et le lien sont temporaires et à usage unique.</p>"
          }
          JSON

          code=$(curl -sS -o /tmp/supabase-auth-response.txt -w "%{http_code}" \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          echo "SUPABASE_HTTP_STATUS=$code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi

      - name: Confirmation
        run: echo "AUTH_EMAIL_OTP_AND_MAGICLINK_CONFIGURED"

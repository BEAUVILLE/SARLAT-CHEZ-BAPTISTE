name: SARLAT return DIGIYLYFE one-shot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible DIGIYLYFE return
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''            <div class="top-actions">\n                <a class="back" href="https://digiylyfe.com/sarlat.html">← Découvrir Sarlat</a>'''
          new = '''            <div class="top-actions">\n                <a href="https://digiylyfe.com/" style="grid-column:1/-1;flex:1 1 100%;width:100%;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border:2px solid #c99743;border-radius:999px;background:#315b43;color:#fff;text-decoration:none;font-size:15px;font-weight:1000;letter-spacing:.02em;box-shadow:0 8px 20px rgba(49,91,67,.22)">← RETOUR DIGIYLYFE.COM</a>\n                <a class="back" href="https://digiylyfe.com/sarlat.html">← Découvrir Sarlat</a>'''
          if old not in s:
              raise SystemExit('Target top-actions block not found; no change made')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "UI: add visible DIGIYLYFE.COM return on Sarlat" || exit 0
          git push

name: Correctif calendrier Chez Baptiste

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.event.issue.title == 'DIGIY CALENDAR PATCH FINAL 20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Appliquer le calendrier validé
        run: python calendar_patch_20260819.py

      - name: Publier et nettoyer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show e62cbc5976b1db03f166f43d9ae94de5a1c5037e:.github/workflows/apply-mobile-compact.yml > .github/workflows/apply-mobile-compact.yml
          git rm .github/workflows/fix-calendar-on-issue.yml
          git rm calendar_patch_20260819.py
          git add index.html .github/workflows/apply-mobile-compact.yml
          git commit -m "Met à jour les indisponibilités du calendrier"
          git push

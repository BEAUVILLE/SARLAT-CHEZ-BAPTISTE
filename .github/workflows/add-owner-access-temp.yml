name: Ajouter accès propriétaire

on:
  push:
    paths:
      - .github/workflows/add-owner-access-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajouter le bouton propriétaire uniquement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = '''            <a class="back" href="https://digiylyfe.com/sarlat.html">← Découvrir Sarlat</a>'''
          new = '''            <div class="actions" style="margin-top:0;">
                <a class="back" href="https://digiylyfe.com/sarlat.html">← Découvrir Sarlat</a>
                <a class="back" href="./gestion.html" rel="nofollow">🔐 Accès propriétaire</a>
            </div>'''
          if './gestion.html' in html:
              raise SystemExit('Accès propriétaire déjà présent : aucune modification')
          if old not in html:
              raise SystemExit('Ancre attendue introuvable : arrêt sans modification')
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Vérifier la portée et publier
        shell: bash
        run: |
          changed=$(git diff --name-only)
          test "$changed" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Affiche l’accès propriétaire Chez Baptiste"
          git push

      - name: Nettoyer le workflow temporaire
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/add-owner-access-temp.yml
          git commit -m "Nettoie le workflow accès propriétaire temporaire"
          git push

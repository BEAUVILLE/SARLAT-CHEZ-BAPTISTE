name: Corriger les etats LOC proprietaire

on:
  push:
    paths:
      - .github/workflows/fix-loc-owner-status.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gestion proprietaire
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('gestion.html')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r"  async function applyState\(status\)\{.*?\n  \}\n\n  async function saveBasePrice", re.S)
          replacement="""  async function applyState(status){
    const dates=selectedDates();
    if(!dates.length)return setMsg(saveStatus,'⚠️ Sélectionnez une date ou une période.',true);
    if(!unitId)return setMsg(saveStatus,'⚠️ Aucun hébergement sélectionné.',true);
    setMsg(saveStatus,'Enregistrement de l’état…');
    const {data,error}=await db.rpc('digiy_loc_set_unit_calendar_state',{
      p_unit_id:unitId,
      p_days:dates,
      p_status:status
    });
    if(error)return setMsg(saveStatus,'⚠️ État refusé : '+error.message,true);
    await loadStates();
    const wanted=status==='available'?null:status;
    const ok=dates.every(day=>(states.get(day)||null)===wanted);
    if(!ok)return setMsg(saveStatus,'⚠️ L’état n’a pas été confirmé en base.',true);
    const label=status==='available'?'Disponible':status==='occupied'?'Occupé':'Fermé';
    setMsg(saveStatus,'✓ '+label+' enregistré sur '+dates.length+(dates.length===1?' date.':' dates.'));
    resetSelection();
    render();
  }

  async function saveBasePrice"""
          s2,n=pattern.subn(replacement,s,count=1)
          if n!=1:
            raise SystemExit('applyState introuvable')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fiabiliser Libre Occupe Ferme du calendrier LOC"
          git push
# relance 2026-09-01

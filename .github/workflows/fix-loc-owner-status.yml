name: Corriger les etats LOC proprietaire

on:
  push:
    paths:
      - .github/workflows/fix-loc-owner-status.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gestion proprietaire
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('gestion.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"async function applyState\(status\)\{.*?\}\nasync function saveBasePrice", re.S)
          replacement = (
              "async function applyState(status){\n"
              "  const dates=selectedDates();\n"
              "  if(!dates.length)return msg(saveStatus,'⚠️ Sélectionnez une date ou une période.',true);\n"
              "  if(!unitId)return msg(saveStatus,'⚠️ Aucun hébergement sélectionné.',true);\n"
              "  msg(saveStatus,'Enregistrement de l’état…');\n"
              "  const {data,error}=await db.rpc('digiy_loc_set_unit_calendar_state_v2',{\n"
              "    p_unit_id:unitId,\n"
              "    p_days:dates,\n"
              "    p_status:status\n"
              "  });\n"
              "  if(error)return msg(saveStatus,'⚠️ État refusé : '+error.message,true);\n"
              "  const rows=Array.isArray(data)?data:[];\n"
              "  if(rows.length!==dates.length)return msg(saveStatus,'⚠️ Réponse incomplète de la base.',true);\n"
              "  rows.forEach(row=>{\n"
              "    if(row.status==='available')states.delete(row.day);\n"
              "    else states.set(row.day,row.status);\n"
              "  });\n"
              "  const label=status==='available'?'Disponible':status==='occupied'?'Occupé':'Fermé';\n"
              "  msg(saveStatus,'✓ '+label+' enregistré sur '+dates.length+(dates.length===1?' date.':' dates.'));\n"
              "  resetSelection();\n"
              "  render();\n"
              "}\n"
              "async function saveBasePrice"
          )
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('applyState introuvable')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Confirmer directement les états LOC depuis Supabase"
          git push

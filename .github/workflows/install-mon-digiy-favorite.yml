name: Install MON DIGIY favorite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mon-digiy-favorite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject MON DIGIY favorite
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(encoding='utf-8'); tag='<script src=\"https://digiylyfe.com/assets/digiy-card-favorite-v1.js?v=20260904-v2\"></script>'; assert '</body>' in t; p.write_text(t if 'digiy-card-favorite-v1.js' in t else t.replace('</body>', tag+'\\n</body>', 1), encoding='utf-8')"
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add MON DIGIY favorite star"
          git push

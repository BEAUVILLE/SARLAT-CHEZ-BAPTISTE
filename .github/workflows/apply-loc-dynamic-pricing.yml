name: Appliquer la tarification propriétaire LOC

on:
  push:
    paths:
      - .github/workflows/apply-loc-dynamic-pricing.yml
      - tools/patch-loc-pricing-owner.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sarlat-loc-pricing-owner
  cancel-in-progress: true

jobs:
  patch-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Appliquer la tarification propriétaire
        run: python tools/patch-loc-pricing-owner.py

      - name: Publier gestion.html
        run: |
          if git diff --quiet -- gestion.html; then
            echo "gestion.html déjà à jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion.html
          git commit -m "Ajouter tarification propriétaire LOC"
          git push

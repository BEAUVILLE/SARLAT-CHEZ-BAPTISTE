name: Synchroniser la fiche publique LOC

on:
  push:
    paths:
      - tools/patch-loc-pricing-public.py
      - .github/workflows/apply-loc-public-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer la synchronisation publique
        run: python tools/patch-loc-pricing-public.py
      - name: Publier index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à publier"
            exit 0
          fi
          git commit -m "Synchroniser disponibilités et tarifs LOC publics"
          git push

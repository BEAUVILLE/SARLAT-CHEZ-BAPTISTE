name: Enforce direct booking

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-room-card.yml

permissions:
  contents: write

jobs:
  direct-booking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Booking and keep direct reservation only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("index.html")
          readme_path = Path("README.md")

          html = index_path.read_text(encoding="utf-8")
          readme = readme_path.read_text(encoding="utf-8")

          html = html.replace(
              '<a class="btn btn-primary" id="bookingTop" href="#" target="_blank" rel="noopener noreferrer">Voir l’annonce Booking →</a>',
              '<a class="btn btn-primary" href="#reservation">Faire une demande directe →</a>'
          )
          html = html.replace(
              '<a class="btn btn-primary" id="bookingBottom" href="#" target="_blank" rel="noopener noreferrer">Ouvrir l’annonce Booking →</a>',
              '<a class="btn btn-primary" href="#reservation">Choisir mes dates →</a>'
          )
          html = html.replace(
              '<section class="section reservation" aria-labelledby="reservation-title">',
              '<section class="section reservation" id="reservation" aria-labelledby="reservation-title">'
          )
          html = re.sub(
              r',bookingUrl:"https://www\.booking\.com/hotel/fr/chez-baptiste\.fr\.html"',
              '',
              html
          )
          html = html.replace(
              '[document.getElementById("bookingTop"),document.getElementById("bookingBottom")].forEach(x=>x.href=CONFIG.bookingUrl);\n    ',
              ''
          )
          html = html.replace("Booking", "réservation directe")
          html = html.replace("booking.com", "sarlat-chez-baptiste.digiylyfe.com")

          start = readme.find("## Bouton Booking")
          end = readme.find("## Informations affichées", start)
          replacement = '''## Réservation directe sans commission

La fiche n'oriente pas le voyageur vers une plateforme de réservation.

La demande se fait directement par :

```text
Calendrier intégré à la fiche
WhatsApp France : +33 6 38 32 94 23
Email : baptistejb24@gmail.com
```

DIGIYLYFE ne prélève aucune commission. Baptiste confirme personnellement les dates et le montant avant tout paiement.

'''
          if start != -1:
              if end == -1:
                  readme = readme[:start] + replacement
              else:
                  readme = readme[:start] + replacement + readme[end:]

          if "Booking" in html or "booking.com" in html:
              raise SystemExit("Une référence Booking reste dans index.html")
          if "Booking" in readme or "booking.com" in readme:
              raise SystemExit("Une référence Booking reste dans README.md")
          if 'href="#reservation"' not in html:
              raise SystemExit("Le bouton direct vers le calendrier manque")

          index_path.write_text(html, encoding="utf-8")
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit direct booking correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/replace-room-card.yml
          git add index.html README.md .github/workflows/replace-room-card.yml
          git commit -m "Remove Booking and keep zero-commission direct booking"
          git push

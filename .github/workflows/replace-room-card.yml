name: Apply direct booking correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-room-card.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct direct booking and Sendwave details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          readme_path = Path('README.md')
          html = index_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          html = html.replace(
            '<a class="btn btn-primary" id="bookingTop" href="#" target="_blank" rel="noopener noreferrer">Voir l’annonce Booking →</a>',
            '<a class="btn btn-primary" href="#reservation">Faire une demande directe →</a>'
          )
          html = html.replace(
            '<a class="btn btn-primary" id="bookingBottom" href="#" target="_blank" rel="noopener noreferrer">Ouvrir l’annonce Booking →</a>',
            '<a class="btn btn-primary" href="#reservation">Choisir mes dates →</a>'
          )
          html = html.replace(
            '<section class="section reservation" aria-labelledby="reservation-title">',
            '<section class="section reservation" id="reservation" aria-labelledby="reservation-title">'
          )
          html = html.replace(
            'const CONFIG={siteUrl:"https://sarlat-chez-baptiste.digiylyfe.com/",bookingUrl:"https://www.booking.com/hotel/fr/chez-baptiste.fr.html",whatsapp:"33638329423",email:"baptistejb24@gmail.com",sendwaveNumber:"+221771342889",address:',
            'const CONFIG={siteUrl:"https://sarlat-chez-baptiste.digiylyfe.com/",whatsapp:"33638329423",email:"baptistejb24@gmail.com",sendwaveNumber:"+221771342889",sendwaveName:"JB BRAUVILLE",address:'
          )
          html = re.sub(
            r'\s*\[document\.getElementById\("bookingTop"\),document\.getElementById\("bookingBottom"\)\]\.forEach\(x=>x\.href=CONFIG\.bookingUrl\);',
            '',
            html
          )
          html = html.replace(
            '<article class="truth-box"><strong>Paiement direct par Sendwave</strong><p>Numéro : <strong>+221 77 134 28 89</strong><br>Bénéficiaire : <strong>JB BRAUVILLE</strong></p><p>Paiement uniquement après confirmation écrite. Ne transmettez jamais vos codes secrets.</p>',
            '<article class="truth-box"><strong>Paiement direct par Sendwave</strong><p>Numéro sénégalais : <strong>+221 77 134 28 89</strong><br>Nom du bénéficiaire : <strong>JB BRAUVILLE</strong></p><p>Paiement uniquement après confirmation écrite de Baptiste. Vérifiez le nom et le numéro avant l’envoi. Ne transmettez jamais vos codes secrets.</p>'
          )
          html = html.replace(
            '"Je comprends que cette demande doit être confirmée par écrit avant tout paiement."',
            '"Paiement prévu par Sendwave après confirmation : JB BRAUVILLE — +221 77 134 28 89", "Je comprends que cette demande doit être confirmée par écrit avant tout paiement."'
          )

          start = readme.find('## Bouton Booking')
          end = readme.find('## Informations affichées', start)
          direct = '''## Réservation directe — 0 % de commission

La fiche n’oriente pas le voyageur vers une plateforme payante.

La demande se fait directement par :

```text
Calendrier intégré
WhatsApp France : +33 6 38 32 94 23
Email : baptistejb24@gmail.com
```

Paiement après confirmation écrite :

```text
Sendwave : +221 77 134 28 89
Bénéficiaire : JB BRAUVILLE
```

DIGIYLYFE ne prélève aucune commission sur la réservation.

'''
          if start != -1:
            readme = readme[:start] + direct + (readme[end:] if end != -1 else '')

          readme = readme.replace('Booking', 'réservation directe')
          readme = readme.replace('https://www.booking.com/hotel/fr/chez-baptiste.fr.html', 'https://sarlat-chez-baptiste.digiylyfe.com/')

          if 'Booking' in html or 'booking.com' in html:
            raise SystemExit('Référence Booking encore présente dans index.html')
          if 'Booking' in readme or 'booking.com' in readme:
            raise SystemExit('Référence Booking encore présente dans README.md')
          if 'JB BRAUVILLE' not in html or '+221 77 134 28 89' not in html:
            raise SystemExit('Coordonnées Sendwave manquantes')
          if 'href="#reservation"' not in html:
            raise SystemExit('Lien vers le calendrier direct manquant')

          index_path.write_text(html, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/replace-room-card.yml
          git add index.html README.md .github/workflows/replace-room-card.yml
          git commit -m "Remove Booking and confirm direct Sendwave payment"
          git push

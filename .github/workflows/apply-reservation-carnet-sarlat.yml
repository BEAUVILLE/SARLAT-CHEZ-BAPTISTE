name: Carnet des réservations propriétaire Sarlat

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-reservation-carnet-sarlat.py'
      - '.github/workflows/apply-reservation-carnet-sarlat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Poser le carnet des réservations
        run: python3 tools/patch-reservation-carnet-sarlat.py
      - name: Publier uniquement la gestion propriétaire
        run: |
          if git diff --quiet -- gestion.html; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion.html
          git commit -m "Afficher le carnet des réservations propriétaire Sarlat"
          git push

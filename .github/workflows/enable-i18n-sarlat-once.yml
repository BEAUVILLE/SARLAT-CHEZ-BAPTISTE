name: Enable Sarlat i18n once
on:
  push:
    paths:
      - '.github/workflows/enable-i18n-sarlat-once.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          python3 -m py_compile scripts/enable-i18n-once.py
          node --check i18n/sarlat-i18n.js
          for f in i18n/fr.js i18n/en.js i18n/es.js i18n/pt.js i18n/it.js i18n/de.js i18n/nl.js i18n/ar.js; do node --check "$f"; done
      - name: Apply
        run: python3 scripts/enable-i18n-once.py
      - name: Validate result
        run: |
          grep -q 'sarlat-i18n.js?v=20260828-i18n-v1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sarlat Chez Baptiste: activer les 8 langues'
          git push

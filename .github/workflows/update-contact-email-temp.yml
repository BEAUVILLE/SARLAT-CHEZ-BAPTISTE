name: Update Chez Baptiste contact email

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contact-email-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace reservation email only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'baptistejb24@gmail.com'
          new = 'contact@digiylyfe.com'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 occurrences of {old}, found {count}. No change made.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} exact email occurrences.')
          PY

      - name: Commit index only
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use contact@digiylyfe.com for Chez Baptiste reservations [skip ci]"
          git push

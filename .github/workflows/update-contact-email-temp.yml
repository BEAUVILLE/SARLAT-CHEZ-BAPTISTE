name: Update Chez Baptiste contact email

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contact-email-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect email occurrences
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          needle = 'baptistejb24@gmail.com'
          for i, line in enumerate(text.splitlines(), 1):
              if needle in line:
                  print(f'{i}: {line.strip()}')
          print('COUNT=', text.count(needle))
          PY

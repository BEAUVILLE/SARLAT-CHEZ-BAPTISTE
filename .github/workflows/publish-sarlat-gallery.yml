name: Publier la nouvelle galerie Sarlat

on:
  push:
    branches: [main]
    paths:
      - sarlat-gallery.webp
      - .github/workflows/publish-sarlat-gallery.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour la galerie et les métadonnées
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old_photo = '.photo{position:relative;overflow:hidden;min-height:240px;border-radius:20px;background:#25190f}'
          new_photo = '.photo{position:relative;overflow:hidden;min-height:240px;border-radius:20px;background:#25190f url("sarlat-gallery.webp") no-repeat;background-size:300% 200%}.photo-1{background-position:0 0}.photo-2{background-position:50% 0}.photo-3{background-position:100% 0}.photo-4{background-position:0 100%}.photo-5{background-position:50% 100%}.photo-6{background-position:100% 100%}'
          if old_photo in html:
              html = html.replace(old_photo, new_photo, 1)
          elif 'background-size:300% 200%' not in html:
              raise SystemExit('Bloc CSS photo introuvable')

          gallery = '''<section class="section"><span class="eyebrow">Photos réelles</span><h2>Découvrez les espaces.</h2><div class="gallery"><figure class="photo photo-1" role="img" aria-label="Pièce de vie et salle à manger"><figcaption>La pièce de vie et la salle à manger</figcaption></figure><figure class="photo photo-2" role="img" aria-label="Chambre avec cheminée en pierre"><figcaption>La chambre avec cheminée en pierre</figcaption></figure><figure class="photo photo-3" role="img" aria-label="Chambre privée avec grand lit"><figcaption>La chambre privée</figcaption></figure><figure class="photo photo-4" role="img" aria-label="Cuisine équipée et partagée"><figcaption>La cuisine équipée</figcaption></figure><figure class="photo photo-5" role="img" aria-label="Salle de bain privative avec baignoire"><figcaption>La salle de bain privative</figcaption></figure><figure class="photo photo-6" role="img" aria-label="Cheminée en pierre du Périgord"><figcaption>Le cachet de la pierre du Périgord</figcaption></figure></div></section>'''

          pattern = r'<section class="section"><span class="eyebrow">Photos réelles</span><h2>Découvrez les espaces\.</h2><div class="gallery">.*?</div></section>'
          html, count = re.subn(pattern, gallery, html, count=1, flags=re.S)
          if count != 1 and 'photo photo-6' not in html:
              raise SystemExit('Galerie actuelle introuvable')

          html = re.sub(
              r'<meta property="og:image" content="[^"]*">',
              '<meta property="og:image" content="https://sarlat-chez-baptiste.digiylyfe.com/CARTE%20SARLAT%20BAPTISTE.png">',
              html,
              count=1
          )
          html = html.replace(
              '<img src="https://digiylyfe.net/wp-content/uploads/2026/07/1D087BF5-6D9F-462D-91A5-6420FC1A20BD_1_105_c.jpeg" alt="Centre médiéval de Sarlat-la-Canéda">',
              '<img src="https://digiylyfe.net/wp-content/uploads/2026/07/1D087BF5-6D9F-462D-91A5-6420FC1A20BD_1_105_c.jpeg" alt="Centre médiéval de Sarlat-la-Canéda" loading="eager" fetchpriority="high" decoding="async">',
              1
          )

          if 'sarlat-gallery.webp' not in html or 'photo photo-6' not in html:
              raise SystemExit('Contrôle final de la galerie échoué')
          if 'F9595D25-B9F1-4049-95CD-00554BC8F369.png' in html:
              raise SystemExit('Anciennes photos encore présentes')

          p.write_text(html, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = re.sub(
                  r'## Photos réelles\n\n.*?\n\n## Fichiers principaux',
                  '## Photos réelles\n\n- pièce de vie et salle à manger ;\n- chambre avec cheminée en pierre ;\n- chambre privée avec grand lit ;\n- cuisine équipée ;\n- salle de bain privative ;\n- détail de la pierre du Périgord.\n\nLa galerie optimisée est servie localement depuis `sarlat-gallery.webp`.\n\n## Fichiers principaux',
                  text,
                  count=1,
                  flags=re.S
              )
              text = text.replace('CARTE SARLAT BAPTISTE.png\n```', 'CARTE SARLAT BAPTISTE.png\nsarlat-gallery.webp\n```', 1)
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Publier la version finale
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/publish-sarlat-gallery.yml
          git add -A
          git commit -m "Publish optimized Sarlat photo gallery"
          git push

name: Fix JB Beauville once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jb-beauville-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch beneficiary name deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'JB BRAUVILLE'
          new = 'JB Beauville'
          n = s.count(old)
          if n != 3:
              raise SystemExit(f'Expected 3 occurrences of {old!r}, found {n}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Replaced {n} occurrences: {old} -> {new}')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-jb-beauville-once.yml
          git add index.html
          git diff --cached --check
          git commit -m 'fix: align Sendwave beneficiary to JB Beauville [skip ci]'
          git push origin HEAD:main

# DIGIY media optimization trigger 20260830
name: Optimiser medias Sarlat Chez Baptiste

on:
  push:
    paths:
      - '.github/workflows/optimiser-medias-sarlat.yml'

permissions:
  contents: write

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer convertisseurs
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin

      - name: Rapatrier les photos Sarlat
        run: |
          set -euo pipefail
          mkdir -p assets/sarlat
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/1D087BF5-6D9F-462D-91A5-6420FC1A20BD_1_105_c.jpeg' -o assets/sarlat/hero-centre-medieval.jpg
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/F9595D25-B9F1-4049-95CD-00554BC8F369.png' -o assets/sarlat/chambre-privee.png
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/254BB65E-9E5B-4316-AD0F-C7DA83DFAC6E.png' -o assets/sarlat/chambre-autre-angle.png
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/83C44D61-28B0-4020-A1DF-B7D72F5081B8.png' -o assets/sarlat/cuisine-equipee.png
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/B4063FF2-EBFE-4191-A7E3-82D524060858.png' -o assets/sarlat/salle-a-manger.png
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/8515DA79-52D4-4802-A9B2-502BBA8DA067.png' -o assets/sarlat/salle-a-manger-autre-vue.png
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/07/E8A9CEFE-987D-442E-B094-07C933E8C27B.png' -o assets/sarlat/salle-de-bain.png

      - name: Convertir en WebP et AVIF
        run: |
          set -euo pipefail
          for file in assets/sarlat/*.{jpg,png}; do
            [ -e "$file" ] || continue
            base="${file%.*}"
            cwebp -quiet -q 82 "$file" -o "${base}.webp"
            avifenc --min 28 --max 35 --speed 6 "$file" "${base}.avif" >/dev/null
          done
          cwebp -quiet -q 82 'CARTE SARLAT BAPTISTE.png' -o 'CARTE SARLAT BAPTISTE.webp'
          avifenc --min 28 --max 35 --speed 6 'CARTE SARLAT BAPTISTE.png' 'CARTE SARLAT BAPTISTE.avif' >/dev/null

      - name: Basculer la vitrine vers les formats legers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hero = '''<img src="https://digiylyfe.net/wp-content/uploads/2026/07/1D087BF5-6D9F-462D-91A5-6420FC1A20BD_1_105_c.jpeg" alt="Centre médiéval de Sarlat-la-Canéda" loading="lazy">'''
          new_hero = '''<picture class="digiy-hero-picture"><source type="image/avif" srcset="assets/sarlat/hero-centre-medieval.avif"><source type="image/webp" srcset="assets/sarlat/hero-centre-medieval.webp"><img src="assets/sarlat/hero-centre-medieval.jpg" alt="Centre médiéval de Sarlat-la-Canéda" decoding="async"></picture>'''
          if old_hero not in s:
              raise SystemExit('Hero Sarlat introuvable')
          s = s.replace(old_hero, new_hero, 1)

          replacements = {
              'https://digiylyfe.net/wp-content/uploads/2026/07/F9595D25-B9F1-4049-95CD-00554BC8F369.png':'assets/sarlat/chambre-privee.png',
              'https://digiylyfe.net/wp-content/uploads/2026/07/254BB65E-9E5B-4316-AD0F-C7DA83DFAC6E.png':'assets/sarlat/chambre-autre-angle.png',
              'https://digiylyfe.net/wp-content/uploads/2026/07/83C44D61-28B0-4020-A1DF-B7D72F5081B8.png':'assets/sarlat/cuisine-equipee.png',
              'https://digiylyfe.net/wp-content/uploads/2026/07/B4063FF2-EBFE-4191-A7E3-82D524060858.png':'assets/sarlat/salle-a-manger.png',
              'https://digiylyfe.net/wp-content/uploads/2026/07/8515DA79-52D4-4802-A9B2-502BBA8DA067.png':'assets/sarlat/salle-a-manger-autre-vue.png',
              'https://digiylyfe.net/wp-content/uploads/2026/07/E8A9CEFE-987D-442E-B094-07C933E8C27B.png':'assets/sarlat/salle-de-bain.png',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Photo Sarlat introuvable: {old}')
              s = s.replace(old,new)

          old_bg = '''bg: "https://digiylyfe.net/wp-content/uploads/2026/07/1D087BF5-6D9F-462D-91A5-6420FC1A20BD_1_105_c.jpeg",'''
          new_bg = '''bg: "assets/sarlat/hero-centre-medieval.webp",'''
          if old_bg not in s:
              raise SystemExit('Fond promo Sarlat introuvable')
          s = s.replace(old_bg, new_bg, 1)

          old_image_html = '''const imageHtml = `<img src="${s.src}" alt="${s.alt}" loading="${i===0?'eager':'lazy'}">`;'''
          new_image_html = '''const base = s.src.replace(/\\.(png|jpe?g)$/i, "");
                        const imageHtml = `<picture class="digiy-slide-picture"><source type="image/avif" srcset="${base}.avif"><source type="image/webp" srcset="${base}.webp"><img src="${s.src}" alt="${s.alt}" loading="${i===0?'eager':'lazy'}" decoding="async"></picture>`;'''
          if old_image_html not in s:
              raise SystemExit('Générateur galerie introuvable')
          s = s.replace(old_image_html, new_image_html, 1)

          old_card = '''<img src="CARTE%20SARLAT%20BAPTISTE.png" alt="Carte officielle SARLAT CHEZ BAPTISTE" loading="lazy">'''
          new_card = '''<picture class="digiy-official-card-picture"><source type="image/avif" srcset="CARTE%20SARLAT%20BAPTISTE.avif"><source type="image/webp" srcset="CARTE%20SARLAT%20BAPTISTE.webp"><img src="CARTE%20SARLAT%20BAPTISTE.png" alt="Carte officielle SARLAT CHEZ BAPTISTE" loading="lazy" decoding="async"></picture>'''
          if old_card not in s:
              raise SystemExit('Carte officielle introuvable')
          s = s.replace(old_card, new_card, 1)

          marker = '/* DIGIY media opt Sarlat 20260830 */'
          if marker not in s:
              css = '''\n        /* DIGIY media opt Sarlat 20260830 */\n        .hero>picture.digiy-hero-picture{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}\n        .hero>picture.digiy-hero-picture>img{width:100%;height:100%;object-fit:cover;object-position:50% 85%;display:block}\n        .slider-slide>picture.digiy-slide-picture{display:block;width:100%;height:100%}\n        .slider-slide>picture.digiy-slide-picture>img{width:100%;height:100%;object-fit:cover;display:block}\n        .official-card-main picture.digiy-official-card-picture{display:block;width:100%}\n        .official-card-main picture.digiy-official-card-picture>img{display:block;width:100%;height:auto}\n'''
              s = s.replace('    </style>', css + '    </style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Controler les gains
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for src in sorted(Path('assets/sarlat').glob('*')):
              if src.suffix.lower() not in {'.png','.jpg'}:
                  continue
              base=src.with_suffix('')
              webp=base.with_suffix('.webp'); avif=base.with_suffix('.avif')
              print(f'{src}: original={src.stat().st_size} webp={webp.stat().st_size} avif={avif.stat().st_size}')
          src=Path('CARTE SARLAT BAPTISTE.png'); webp=Path('CARTE SARLAT BAPTISTE.webp'); avif=Path('CARTE SARLAT BAPTISTE.avif')
          print(f'{src}: original={src.stat().st_size} webp={webp.stat().st_size} avif={avif.stat().st_size}')
          PY

      - name: Publier optimisation
        run: |
          set -euo pipefail
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/sarlat 'CARTE SARLAT BAPTISTE.webp' 'CARTE SARLAT BAPTISTE.avif'
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: optimiser Sarlat Chez Baptiste en AVIF et WebP'
          git push

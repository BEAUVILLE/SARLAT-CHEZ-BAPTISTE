name: Correction définitive du calendrier index

on:
  push:
    paths:
      - .github/workflows/apply-mobile-compact.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Corriger index.html
        run: python calendar_source_patch_final.py

      - name: Publier index et restaurer le workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 520dd3dad4d224d23c6d54e8584757af6d4c0f4b:.github/workflows/apply-mobile-compact.yml > .github/workflows/apply-mobile-compact.yml
          git rm calendar_source_patch_final.py
          git add index.html .github/workflows/apply-mobile-compact.yml
          git commit -m "Corrige définitivement le calendrier de Chez Baptiste"
          git push

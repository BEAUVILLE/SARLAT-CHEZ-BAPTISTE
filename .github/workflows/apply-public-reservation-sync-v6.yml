name: Synchro publique réservation Sarlat V6

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-public-reservation-sync-v6.py'
      - '.github/workflows/apply-public-reservation-sync-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corriger la synchro publique
        run: python3 tools/patch-public-reservation-sync-v6.py
      - name: Publier uniquement index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fiabiliser la synchro publique réservation Sarlat"
          git push
